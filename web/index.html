<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprender japonés con videos de YouTube: subtítulos separados en palabras con su significado en contexto, mazo y repaso.">
<meta name="theme-color" content="#14111f">
<title>映画館 Cine · Sandō</title>
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="app">
<div id="consola">
  <header id="hud">
    <button id="hud-perfil" class="hud-nombre" title="Mi progreso"><span id="hud-titulo">映画館</span><span id="hud-nivel">Nv 1</span></button>
    <div class="hud-skills">
      <div class="skill" data-skill="jp"><span class="ico">映</span><div class="barra"><i></i></div><b>1</b></div>
    </div>
    <div class="hud-der">
      <button id="hud-misiones" title="Misiones de hoy">Misiones 0/3</button>
      <span id="hud-racha" title="Racha de días practicando">Racha 0</span>
      <span id="hud-ia" title="Estado de la IA local">IA ···</span>
      <button id="btn-menu" title="Opciones" aria-label="Opciones">☰</button>
    </div>
  </header>

  <main id="pantalla">
    <div id="dialogo" class="oculto">
      <div id="dialogo-nombre"></div>
      <div id="dialogo-texto"></div>
      <div id="dialogo-trad" class="oculto"></div>
      <div id="dialogo-opciones"></div>
      <div id="dialogo-sigue">▼</div>
    </div>
    <div id="globo" class="oculto"></div>
    <section id="actividad" class="oculto"></section>
    <div id="fundido"></div>
  </main>

  <footer id="ayuda"><span><kbd>flechas</kbd> moverse</span> <span><kbd>Enter</kbd> elegir</span> <span><kbd>Esc</kbd>/<kbd>X</kbd> volver</span> <span>clic en japonés = traducción</span> <span><kbd>←</kbd>/<kbd>→</kbd> línea · <kbd>R</kbd> repetir · <kbd>T</kbd> traducción · <kbd>G</kbd> guion</span></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="celebracion" class="oculto" aria-live="assertive"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
